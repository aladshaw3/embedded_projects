esphome:
  name: vl53l4cd-test

esp32:
  board: featheresp32
  framework:
    type: arduino

external_components:
  - source:
      type: local
      path: custom_components

logger:
  level: DEBUG
  baud_rate: 115200

i2c:
  sda: GPIO22
  scl: GPIO20
  scan: true
  frequency: 50kHz

sensor:
  # --- VL53L4CD Component ---
  - platform: vl53l4cd
    id: vl53l4cd_distance
    name: "VL53L4CD Distance"
    address: 0x29
    update_interval: 250ms

  # --- INA228 Component ---
  - platform: ina2xx_i2c
    id: my_charge_sensor
    model: INA228
    address: 0x40
    shunt_resistance: 0.010 ohm
    max_current: 10 A
    adc_range: 0
    update_interval: 250ms
    current:
      id: ina228_current
      name: "INA228 Current"
    bus_voltage:
      id: ina228_voltage
      name: "INA228 Bus Voltage"
    power:
      id: ina228_power
      name: "INA228 Power"

interval:
  - interval: 250ms
    then:
      - lambda: |-
          float voltage = id(ina228_voltage).has_state() ? id(ina228_voltage).state : 0.0f;
          float current = id(ina228_current).has_state() ? id(ina228_current).state : 0.0f;
          float power   = id(ina228_power).has_state() ? id(ina228_power).state : 0.0f;

          if (id(vl53l4cd_distance).has_state()) {
            float dist_m = id(vl53l4cd_distance).state;
            ESP_LOGI("sensor_summary", 
                     "Distance: %.3f m | Voltage: %.3f V | Current: %.3f A | Power: %.3f W",
                     dist_m, voltage, current, power);
          } else {
            ESP_LOGI("sensor_summary", 
                     "Distance: [Waiting...] | Voltage: %.3f V | Current: %.3f A | Power: %.3f W",
                     voltage, current, power);
          }