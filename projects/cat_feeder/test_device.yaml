esphome:
  name: vl53l4cd-test

esp32:
  board: featheresp32
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_COMPILER_OPTIMIZATION_SIZE: "y"
      CONFIG_COMPILER_OPTIMIZATION_PERF: "n"

external_components:
  - source:
      type: local
      path: custom_components

logger:
  level: INFO
  baud_rate: 115200

i2c:
  sda: GPIO22
  scl: GPIO20
  frequency: 400kHz

sensor:
  - platform: vl53l4cd
    name: "VL53L4CD Distance"
    update_interval: 250ms

