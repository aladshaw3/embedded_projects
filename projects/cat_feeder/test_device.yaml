esphome:
  name: vl53l4cd-test

esp32:
  board: featheresp32
  framework:
    type: arduino

external_components:
  - source:
      type: local
      path: custom_components

logger:
  level: INFO
  baud_rate: 115200

i2c:
  sda: GPIO22
  scl: GPIO20
  scan: true
  frequency: 50kHz

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO14
      mode:
        input: true
        pullup: true
    id: pin_14_state
    name: "Digital Pin 14"

sensor:
  - platform: vl53l4cd
    id: vl53l4cd_distance
    name: "VL53L4CD Distance"
    address: 0x29
    update_interval: 250ms

  - platform: ina2xx_i2c
    id: my_charge_sensor
    model: INA228
    address: 0x40
    shunt_resistance: 0.010 ohm
    max_current: 10 A
    adc_range: 0
    update_interval: 250ms
    current:
      id: ina228_current
      name: "INA228 Current"
    bus_voltage:
      id: ina228_voltage
      name: "INA228 Bus Voltage"
    power:
      id: ina228_power
      name: "INA228 Power"

  - platform: adc
    pin: GPIO26
    id: a0_voltage
    name: "A0 Analog Voltage"
    update_interval: 250ms
    attenuation: 12dB
  - platform: nau7802_fixed
    id: gross_scale
    name: "Gross Scale"
    gain: 1
    ldo_voltage: "3.0V"
    update_interval: 3s
    filters:
    - sliding_window_moving_average:
        window_size: 20
        send_every: 10
    - calibrate_linear:
        method: least_squares
        datapoints:
          - 1478-> 0
          - 3019 -> 831
          - 4850 -> 1819
          - 1540 -> 33
          - 2189 -> 383
          - 5622 -> 2235
    unit_of_measurement: g
display:
  - platform: ht16k33_alpha
    id: seven_seg
    address: 0x70
    update_interval: 50ms
    lambda: |-
      if (id(vl53l4cd_distance).has_state()) {
        int dist_mm = static_cast<int>(id(vl53l4cd_distance).state * 1000.0f);
        it.printf("%4d", dist_mm);
      } else {
        it.print("----");
      }

interval:
  - interval: 250ms
    then:
      - lambda: |-
          float voltage = id(ina228_voltage).has_state() ? id(ina228_voltage).state : 0.0f;
          float current = id(ina228_current).has_state() ? id(ina228_current).state : 0.0f;
          float power   = id(ina228_power).has_state() ? id(ina228_power).state : 0.0f;
          bool d14_val  = id(pin_14_state).state;
          float a0_val  = id(a0_voltage).has_state() ? id(a0_voltage).state : 0.0f;

          if (id(vl53l4cd_distance).has_state()) {
            float dist_m = id(vl53l4cd_distance).state;
            int dist_mm = static_cast<int>(dist_m * 1000.0f);
            ESP_LOGI("sensor_summary", 
                     "Dist: %.3fm (%dmm) | V: %.3fV | I: %.3fA | P: %.3fW | A0: %.3fV | D14: %s",
                     dist_m, dist_mm, voltage, current, power, a0_val, d14_val ? "HIGH" : "LOW");
          } else {
            ESP_LOGI("sensor_summary", 
                     "Dist: [Wait] | V: %.3fV | I: %.3fA | P: %.3fW | A0: %.3fV | D14: %s",
                     voltage, current, power, a0_val, d14_val ? "HIGH" : "LOW");
          }